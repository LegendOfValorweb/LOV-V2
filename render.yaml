services:
  - type: web
    name: legends-of-valor-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd Legends-Of-Valor && npm install --include=dev && npm run build:backend
    startCommand: cd Legends-Of-Valor && npm run start:backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
